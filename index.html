<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#211814"
    />

    <meta
      name="description"
      content="Booklira est une application web gratuite pour découvrir, organiser, suivre et partager ses lectures avec ses amis."
    />

    <meta
      name="author"
      content="Booklira"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <link
      rel="canonical"
      href="https://booklira.vercel.app/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon.ico"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/pwa-192x192.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Booklira - Book Tracker et bibliothèque personnelle"
    />

    <meta
      property="og:description"
      content="Découvrez, organisez, suivez et partagez vos lectures avec Booklira, une bibliothèque personnelle et sociale gratuite."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://booklira.vercel.app/"
    />

    <meta
      property="og:site_name"
      content="Booklira"
    />

    <meta
      property="og:locale"
      content="fr_FR"
    />

    <meta
      property="og:image"
      content="https://booklira.vercel.app/pwa-512x512.png"
    />

    <meta
      property="og:image:alt"
      content="Logo Booklira"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Booklira - Book Tracker et bibliothèque personnelle"
    />

    <meta
      name="twitter:description"
      content="Découvrez, organisez, suivez et partagez vos lectures avec Booklira."
    />

    <meta
      name="twitter:image"
      content="https://booklira.vercel.app/pwa-512x512.png"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Booklira",
        "alternateName": "Booklira Book Tracker",
        "url": "https://booklira.vercel.app/",
        "description": "Booklira est une application web gratuite pour découvrir, organiser, suivre et partager ses lectures avec ses amis.",
        "applicationCategory": "LifestyleApplication",
        "applicationSubCategory": "Book tracking",
        "operatingSystem": "Web",
        "isAccessibleForFree": true,
        "inLanguage": "fr-FR",
        "sameAs": [
          "https://github.com/Luk-Charp/Booklira"
        ]
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Booklira",
        "url": "https://booklira.vercel.app/",
        "description": "Booklira, une application web pour suivre, découvrir et partager ses lectures."
      }
    </script>

    <title>Booklira - Book Tracker, bibliothèque et réseau social pour lecteurs</title>
  </head>

  <body>
    <div id="root"></div>

    <noscript>
      <main>
        <h1>Booklira - Book Tracker et bibliothèque personnelle</h1>
        <p>
          Booklira est une application web gratuite pour découvrir, organiser,
          suivre et partager ses lectures.
        </p>
        <p>
          Créez votre bibliothèque personnelle, suivez vos livres et découvrez
          les lectures de vos amis avec Booklira.
        </p>
      </main>
    </noscript>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
